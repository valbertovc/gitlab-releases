[tox]
envlist =
    py312-django52,
    py313-django60,
    py314-django61
skip_missing_interpreters = true

[testenv]
basepython =
    py312: python3.12
    py313: python3.13
    py314: python3.14
deps =
    django52: Django>=5.2,<6
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
commands =
    python manage.py test
